<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>기본 입출력</h1>
    <p id="result">결과</p>
    <p id="result2">결과</p>
    <script>
      alert("alert 메세지 창입니다.");
      let replyYN = confirm("Yes or No?");
      document.querySelector("#result").innerHTML = "결과: " + replyYN;
      let name = prompt("이름이 뭐에요?");
      document.querySelector("#result2").innerHTML = name + "님 환영합니다. ";
    </script>
  </body>
</html>
