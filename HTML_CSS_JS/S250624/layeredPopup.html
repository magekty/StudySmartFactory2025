<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #open {
        background-color: blue;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 15px;
      }
      #close {
        float: right;
      }
      #modal-box {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background-color: rgba(0, 0, 0, 0.6);
        justify-content: center;
        align-items: center;
      }
      #modal-box.active {
        display: flex;
      }
      #modal-content {
        background-color: white;
        width: 300px;
        padding: 20px;
        border-radius: 5px;
        position: relative;
      }
      img {
        width: 80px;
        height: 80px;
      }
      #profile {
        display: flex;
        justify-content: center;
        align-items: center;
        border: solid 1px gray;
      }
      #desc {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <button id="open">프로필 보기</button>
    <div id="modal-box">
      <div id="modal-content">
        <button id="close">&times;</button>
        <h1 id="title">내 프로필</h1>
        <div id="profile">
          <img src="../S250617/imges/딸기.jpg" alt="" />
          <div id="desc">
            <p class="user">이름: 딸기</p>
            <p class="user">소속: xx농장</p>
            <p class="user">국적: 국산</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      const modalBox = document.querySelector("#modal-box");
      const open = document.querySelector("#open");
      const close = document.querySelector("#close");
      open.addEventListener("click", () => {
        modalBox.classList.add("active");
      });
      close.addEventListener("click", () => {
        modalBox.classList.remove("active");
      });
    </script>
  </body>
</html>
