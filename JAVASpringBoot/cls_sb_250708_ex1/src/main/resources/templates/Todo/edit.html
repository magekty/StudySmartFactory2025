<form method="post" th:action="@{/todos/edit/{id}(id=${todo.id})}" th:object="${todo}">
	<label>Title:
		<input th:field="*{title}" type="text">
	</label>
	<label>Done:
		<input th:field="*{done}" type="checkbox"/>
	</label>
	<button type="submit">수정</button>
	<a th:href="@{/todos}">Cancel</a>
	<div th:errors="*{title}" th:if="${#fields.hasErrors('title')}"></div>
</form>

</body>
