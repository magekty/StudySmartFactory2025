<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>강의 추가</title>
</head>
<body>
<h1>Course 추가</h1>
<form method="post" th:action="@{/univ/courses/new}" th:object="${course}">

</form>
</body>
</html>
