<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>수강 신청 내역</title>
</head>
<body>
<h1>수강 신청 내역</h1>
<table border="1">
	<tr>
		<th>학생 이름</th>
		<th>학생 카드 번호</th>
		<th>강의 이름</th>
		<th>삭제</th>
	</tr>
	<tr th:each="enrollment : ${enrollments}">
		<td th:text="${enrollment.student.name}"></td>
		<td th:text="${enrollment.student.studentCard != null ?
		enrollment.student.studentCard.cardNumber : 'No Card'}"></td>
		<td th:text="${enrollment.course.title}"></td>
		<td>
			<form method="post" th:action="@{/univ/enrollments/delete}">
				<input name="id" th:value="${enrollment.id}" type="hidden"/>
				<button type="submit">삭제</button>
			</form>
		</td>
	</tr>
</table>
</body>
</html>
