<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thymeleaf switch</title>
</head>
<body>
<div th:switch="${role}">
    <p th:case="ADMIN">관리자시네요</p>
    <p th:case="USER">일반사원시네요</p>
    <p th:case="*">누구세요?</p>

</div>
</body>
</html>
