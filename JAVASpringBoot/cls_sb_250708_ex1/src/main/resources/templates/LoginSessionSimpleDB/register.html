<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>세션 로그인 예제 MySQL - 회원가입</title>
</head>
<body>
<h1>세션 로그인 예제 MySQL - 회원가입</h1>
<form method="post" th:action="@{/LoginSessionSimpleDB/register}">
  <label>아이디: <input type="text" name="username" /></label>
  <label>PW: <input type="password" name="password" /></label>
  <button type="submit">회원 가입</button>
</form>

<p th:if="${error}" style="color:red" th:text="${error}"></p>

<p><a href="@{/LoginSessionSimpleDB/login}">로그인 페이지로 이동</a></p>


</body>
</html>
