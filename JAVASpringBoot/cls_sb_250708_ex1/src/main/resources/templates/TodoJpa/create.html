<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Create todo</title>
</head>
<body>
<h1>create todoJpa</h1>
<form method="post" th:action="@{/todoJpaes/create}" th:object="${todoJpa}">
	<label>
		Title:
		<input th:field="*{title}" type="text"/>
	</label>
	<button type="submit">Save</button>
	<a th:href="@{/todoJpaes}">Cancel</a>
	<br>
	<div th:errors="*{title}" th:if="${#fields.hasErrors('title')}"></div>
</form>
</body>
</html>
